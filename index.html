<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚲</text></svg>">
<title>鹈鹕骑车 🚲 · 3D Pelican Riding a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
  canvas { display: block; touch-action: none; }
  #overlay { position: fixed; top: 18px; left: 20px; color: #fff; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #overlay h1 { margin: 0; font-size: clamp(22px, 4vw, 36px); letter-spacing: 2px; }
  #overlay p { margin: 6px 0 0; font-size: clamp(12px, 2vw, 15px); opacity: .9; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">加载中…</div>
<div id="overlay">
  <h1>鹈鹕骑车 🚲</h1>
  <p>拖动旋转视角 · 滚轮缩放</p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
document.getElementById('loading').remove();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe6ff, 40, 110);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;
controls.enablePan = false;

// ---------- sky ----------
{
  const skyGeo = new THREE.SphereGeometry(200, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x3d8bff) },
      mid: { value: new THREE.Color(0x9fd0ff) },
      bottom: { value: new THREE.Color(0xfff1d6) },
    },
    vertexShader: `varying vec3 vPos; void main(){ vPos = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; varying vec3 vPos;
      void main(){ float h = vPos.y; vec3 c = h > 0.0 ? mix(mid, top, smoothstep(0.0, 0.6, h)) : mix(mid, bottom, smoothstep(0.0, -0.2, h));
      c = mix(bottom, c, smoothstep(-0.05, 0.12, h)); gl_FragColor = vec4(c, 1.0); }`,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6a8f4a, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -7; sc.right = 7; sc.top = 7; sc.bottom = -7; sc.near = 1; sc.far = 60;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(8, 18, 6);

// ---------- helpers ----------
const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.0, ...opts });
const shade = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
const UP = new THREE.Vector3(0, 1, 0);
const _v = new THREE.Vector3();

// cylinder of height 1 that can be stretched between two points
function makeStretch(radius, material, radialSegments = 12) {
  const g = new THREE.CylinderGeometry(radius, radius, 1, radialSegments);
  return shade(new THREE.Mesh(g, material));
}
function placeBetween(mesh, a, b) {
  _v.subVectors(b, a);
  const len = _v.length();
  mesh.position.copy(a).addScaledVector(_v, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, _v.normalize());
  mesh.scale.set(1, len, 1);
}
function tube(parent, a, b, radius, material) {
  const m = makeStretch(radius, material);
  placeBetween(m, a, b);
  parent.add(m);
  return m;
}
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

// ---------- ground & road ----------
const ROAD_R = 13;
{
  const grass = shade(new THREE.Mesh(new THREE.CircleGeometry(160, 64), mat(0x7cc35a, { roughness: 1 })));
  grass.rotation.x = -Math.PI / 2;
  grass.castShadow = false;
  scene.add(grass);

  const road = new THREE.Mesh(new THREE.RingGeometry(ROAD_R - 1.4, ROAD_R + 1.4, 160), mat(0x55585e, { roughness: 0.95 }));
  road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true;
  scene.add(road);

  for (const r of [ROAD_R - 1.45, ROAD_R + 1.45]) {
    const curb = new THREE.Mesh(new THREE.TorusGeometry(r, 0.08, 6, 160), mat(0xf2f2f2));
    curb.rotation.x = -Math.PI / 2; curb.position.y = 0.03; curb.receiveShadow = true;
    scene.add(curb);
  }
  const dashMat = mat(0xffe066, { roughness: 0.8 });
  const dashGeo = new THREE.BoxGeometry(0.7, 0.02, 0.12);
  const N = 48;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const d = new THREE.Mesh(dashGeo, dashMat);
    d.position.set(Math.cos(a) * ROAD_R, 0.02, Math.sin(a) * ROAD_R);
    d.rotation.y = -a - Math.PI / 2;
    d.receiveShadow = true;
    scene.add(d);
  }
}

// trees, flowers & clouds
const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
{
  const trunkMat = mat(0x8b5a2b);
  const leafMats = [mat(0x3f9b4a), mat(0x2f8a3e), mat(0x5bb35a)];
  for (let i = 0; i < 70; i++) {
    const a = rand() * Math.PI * 2;
    const inner = rand() < 0.3;
    const r = inner ? 2 + rand() * (ROAD_R - 6) : ROAD_R + 9 + rand() * 40;
    const s = 0.7 + rand() * 0.9;
    const t = new THREE.Group();
    t.add(shade(new THREE.Mesh(new THREE.CylinderGeometry(0.15 * s, 0.22 * s, 1.4 * s, 8), trunkMat)));
    t.children[0].position.y = 0.7 * s;
    const lm = leafMats[i % 3];
    if (rand() < 0.5) {
      for (let k = 0; k < 3; k++) {
        const c = shade(new THREE.Mesh(new THREE.ConeGeometry((1.3 - k * 0.3) * s, 1.4 * s, 9), lm));
        c.position.y = (1.6 + k * 0.75) * s; t.add(c);
      }
    } else {
      const c = shade(new THREE.Mesh(new THREE.IcosahedronGeometry(1.2 * s, 1), lm));
      c.position.y = 2.2 * s; t.add(c);
    }
    t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    scene.add(t);
  }
  const flowerCols = [0xff6b9a, 0xffffff, 0xffd43b, 0xb197fc];
  const fg = new THREE.SphereGeometry(0.09, 6, 4);
  for (let i = 0; i < 260; i++) {
    const a = rand() * Math.PI * 2;
    const r = rand() < 0.5 ? ROAD_R - 2 - rand() * 9 : ROAD_R + 2 + rand() * 20;
    const f = new THREE.Mesh(fg, mat(flowerCols[i % 4]));
    f.position.set(Math.cos(a) * r, 0.08, Math.sin(a) * r);
    scene.add(f);
  }
}
const clouds = [];
{
  const cm = mat(0xffffff, { roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.25 });
  for (let i = 0; i < 14; i++) {
    const g = new THREE.Group();
    const n = 4 + Math.floor(rand() * 4);
    for (let k = 0; k < n; k++) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(1.5 + rand() * 1.5, 12, 8), cm);
      p.position.set(k * 1.8 - n, rand() * 0.8, rand() * 1.5);
      g.add(p);
    }
    const a = rand() * Math.PI * 2, r = 30 + rand() * 60;
    g.position.set(Math.cos(a) * r, 18 + rand() * 12, Math.sin(a) * r);
    g.userData.speed = 0.3 + rand() * 0.5;
    clouds.push(g); scene.add(g);
  }
}

// ---------- bicycle ----------
// local frame: +x forward, +y up, +z = left side
const bikeWorld = new THREE.Group();   // position/heading on the road
const bike = new THREE.Group();        // lean
bikeWorld.add(bike);
scene.add(bikeWorld);

const frameMat = mat(0xe63946, { metalness: 0.35, roughness: 0.35 });
const chromeMat = mat(0xd9dde3, { metalness: 0.9, roughness: 0.25 });
const blackMat = mat(0x1d1d1f, { roughness: 0.8 });
const saddleMat = mat(0x2b2b2b, { roughness: 0.5 });

const WHEEL_R = 0.7;
const REAR = V(-1.05, WHEEL_R), FRONT = V(1.05, WHEEL_R), BB = V(0, 0.62);
const SEAT = V(-0.32, 1.5), HEAD_TOP = V(0.74, 1.5), HEAD_BOT = V(0.82, 1.2), TOP_REAR = V(-0.28, 1.42);

function makeWheel() {
  const w = new THREE.Group();
  const tire = shade(new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.05, 0.06, 12, 64), blackMat));
  const rim = shade(new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.11, 0.022, 8, 64), chromeMat));
  w.add(tire, rim);
  const hub = shade(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.16, 12), chromeMat));
  hub.rotation.x = Math.PI / 2; w.add(hub);
  const spokeMat = mat(0xcfd3d8, { metalness: 0.8, roughness: 0.3 });
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    const side = i % 2 ? 0.05 : -0.05;
    tube(w, V(0, 0, side), V(Math.cos(a) * (WHEEL_R - 0.12), Math.sin(a) * (WHEEL_R - 0.12), 0), 0.008, spokeMat);
  }
  // a coloured valve / reflector so spinning is visible
  const refl = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.03), mat(0xffa500, { emissive: 0xff7700, emissiveIntensity: 0.4 }));
  refl.position.set(0, WHEEL_R - 0.28, 0.02); w.add(refl);
  return w;
}
const rearWheel = makeWheel(); rearWheel.position.copy(REAR);
const frontWheel = makeWheel(); frontWheel.position.copy(FRONT);
bike.add(rearWheel, frontWheel);

// frame
tube(bike, BB, SEAT, 0.045, frameMat);
tube(bike, BB, HEAD_BOT, 0.05, frameMat);
tube(bike, TOP_REAR, HEAD_TOP.clone().add(V(-0.02, -0.06)), 0.042, frameMat);
tube(bike, HEAD_BOT, HEAD_TOP, 0.055, frameMat);
for (const z of [-0.08, 0.08]) {
  tube(bike, V(REAR.x, REAR.y, z), V(BB.x, BB.y, z * 0.4), 0.025, frameMat); // chain stays
  tube(bike, V(REAR.x, REAR.y, z), V(TOP_REAR.x, TOP_REAR.y, z * 0.3), 0.022, frameMat); // seat stays
  tube(bike, V(HEAD_BOT.x, HEAD_BOT.y, z * 0.3), V(FRONT.x, FRONT.y, z), 0.026, chromeMat); // fork
}
// seat post + saddle
tube(bike, SEAT, V(-0.35, 1.62), 0.03, chromeMat);
{
  const s = shade(new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 10), saddleMat));
  s.scale.set(0.48, 0.1, 0.26); s.position.set(-0.33, 1.66, 0); bike.add(s);
}
// stem + handlebar
const STEM_TOP = V(0.68, 1.78);
tube(bike, HEAD_TOP, STEM_TOP, 0.03, chromeMat);
tube(bike, V(STEM_TOP.x, STEM_TOP.y, -0.42), V(STEM_TOP.x, STEM_TOP.y, 0.42), 0.025, chromeMat);
const GRIP_L = V(STEM_TOP.x, STEM_TOP.y, 0.36), GRIP_R = V(STEM_TOP.x, STEM_TOP.y, -0.36);
for (const z of [-0.36, 0.36]) {
  const g = shade(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.14, 10), blackMat));
  g.rotation.x = Math.PI / 2; g.position.set(STEM_TOP.x, STEM_TOP.y, z); bike.add(g);
}
// bell
{
  const bell = shade(new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffd43b, { metalness: 0.7, roughness: 0.3 })));
  bell.position.set(STEM_TOP.x, STEM_TOP.y + 0.03, 0.2); bike.add(bell);
}
// basket in front (with a fish!)
{
  const basket = new THREE.Group();
  const bm = mat(0xc68642, { roughness: 0.9 });
  const b = shade(new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.2, 0.26, 14, 1, true), new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.9, side: THREE.DoubleSide })));
  basket.add(b);
  const bottom = shade(new THREE.Mesh(new THREE.CircleGeometry(0.2, 14), bm)); bottom.rotation.x = -Math.PI / 2; bottom.position.y = -0.13; basket.add(bottom);
  const fish = new THREE.Group();
  const fb = shade(new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), mat(0x6fb3d9, { metalness: 0.4, roughness: 0.3 })));
  fb.scale.set(1.8, 0.8, 0.5); fish.add(fb);
  const ft = shade(new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.12, 4), mat(0x5a9ec4)));
  ft.rotation.z = -Math.PI / 2; ft.position.x = -0.22; fish.add(ft);
  fish.position.set(0, 0.14, 0); fish.rotation.z = 0.6;
  basket.add(fish);
  basket.position.set(1.0, 1.55, 0);
  bike.add(basket);
  tube(bike, V(0.86, 1.42), V(0.92, 1.45), 0.015, chromeMat);
}

// crank
const crank = new THREE.Group();
crank.position.copy(BB);
bike.add(crank);
{
  const ring = shade(new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.025, 8, 32), chromeMat));
  ring.position.z = -0.1; crank.add(ring);
  const axle = shade(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.34, 10), chromeMat));
  axle.rotation.x = Math.PI / 2; crank.add(axle);
}
const CRANK_L = 0.3;
const pedals = [];
for (const side of [1, -1]) {
  const arm = shade(new THREE.Mesh(new THREE.BoxGeometry(0.05, CRANK_L, 0.03), chromeMat));
  arm.position.set(0, side * CRANK_L / 2, side * 0.17);
  crank.add(arm);
  const pedal = shade(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.12), blackMat));
  bike.add(pedal); // kept level, positioned each frame
  pedals.push({ mesh: pedal, side });
}
// chain (simple)
tube(bike, V(REAR.x, REAR.y + 0.07, -0.1), V(BB.x, BB.y + 0.2, -0.1), 0.012, blackMat);
tube(bike, V(REAR.x, REAR.y - 0.07, -0.1), V(BB.x, BB.y - 0.2, -0.1), 0.012, blackMat);

// ---------- pelican ----------
const white = mat(0xffffff, { roughness: 0.85, emissive: 0xffffff, emissiveIntensity: 0.08 });
const grey = mat(0xeceef1, { roughness: 0.85 });
const dark = mat(0x2a2a2e, { roughness: 0.8 });
const beakMat = mat(0xff8c00, { roughness: 0.4, emissive: 0xff6a00, emissiveIntensity: 0.25 });
const pouchMat = mat(0xffb627, { roughness: 0.45, emissive: 0xff9900, emissiveIntensity: 0.2 });
const legMat = mat(0xff8a3d, { roughness: 0.6 });

const rider = new THREE.Group(); // bobbing upper body
bike.add(rider);

// body
const body = shade(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), white));
body.scale.set(0.72, 0.5, 0.46);
body.rotation.z = 0.38;
body.position.set(-0.18, 2.12, 0);
rider.add(body);
// chest fluff
{
  const chest = shade(new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 14), white));
  chest.position.set(0.22, 2.35, 0); rider.add(chest);
}
// tail
{
  const tail = shade(new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.6, 12), grey));
  tail.scale.set(1, 1, 0.5);
  tail.rotation.z = Math.PI / 2 - 0.15;
  tail.position.set(-0.9, 1.85, 0); rider.add(tail);
}
// neck (S-curve)
const neckCurve = new THREE.CatmullRomCurve3([V(0.25, 2.45), V(0.48, 2.78), V(0.3, 3.08), V(0.42, 3.36)]);
const neck = shade(new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 32, 0.13, 14, false), white));
rider.add(neck);

// head
const head = new THREE.Group();
head.position.set(0.45, 3.42, 0);
rider.add(head);
{
  const skull = shade(new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), white));
  skull.scale.set(1.15, 1, 0.95); head.add(skull);
  // crest
  const crest = shade(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.25, 8), mat(0xfff0b3)));
  crest.position.set(-0.2, 0.08, 0); crest.rotation.z = 1.9; head.add(crest);
  // eyes
  for (const z of [-1, 1]) {
    const ring = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), mat(0xffc2c2));
    ring.position.set(0.1, 0.06, z * 0.17); ring.scale.z = 0.5; head.add(ring);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 8), mat(0x111111, { roughness: 0.2 }));
    eye.position.set(0.11, 0.065, z * 0.195); head.add(eye);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 4), mat(0xffffff, { emissive: 0xffffff }));
    glint.position.set(0.125, 0.08, z * 0.225); head.add(glint);
  }
  // upper mandible: long flattened tapered beak
  const upperGeo = new THREE.CylinderGeometry(0.035, 0.1, 1.15, 16);
  upperGeo.scale(0.38, 1, 1);
  upperGeo.rotateZ(-Math.PI / 2);
  upperGeo.translate(0.15 + 0.575, -0.02, 0);
  const upper = shade(new THREE.Mesh(upperGeo, beakMat));
  head.add(upper);
  // ridge line on top
  const ridge = shade(new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.012, 0.02), mat(0xe0701a)));
  ridge.position.set(0.72, 0.0, 0); head.add(ridge);
  // hooked tip
  const hook = shade(new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 8), mat(0xe8531a)));
  hook.scale.set(1.2, 1, 0.9); hook.position.set(1.3, -0.05, 0); head.add(hook);
  // throat pouch
  const pouchGeo = new THREE.SphereGeometry(0.5, 24, 16, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.55);
  const pouch = shade(new THREE.Mesh(pouchGeo, pouchMat));
  pouch.scale.set(1.15, 0.6, 0.22);
  pouch.position.set(0.7, -0.02, 0);
  pouch.name = 'pouch';
  head.add(pouch);
  // helmet!
  const helmet = shade(new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2.1), mat(0x1e90ff, { roughness: 0.35, metalness: 0.1 })));
  helmet.scale.set(1.15, 0.85, 1.0); helmet.position.set(-0.02, 0.07, 0); head.add(helmet);
  const stripe = shade(new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.02, 6, 24, Math.PI), mat(0xffffff)));
  stripe.position.set(-0.02, 0.08, 0); stripe.scale.set(1.25, 0.95, 1); head.add(stripe);
}
head.rotation.z = -0.22;

// wings reaching to the handlebars
function makeWing() {
  const g = new THREE.Group();
  const w = shade(new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), white));
  w.scale.set(0.42, 1, 0.14);
  g.add(w);
  const tip = shade(new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 10), dark));
  tip.scale.set(0.24, 0.42, 0.12); tip.position.y = 0.36; g.add(tip);
  const cover = shade(new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 10), grey));
  cover.scale.set(0.34, 0.5, 0.15); cover.position.y = 0.05; cover.position.x = -0.04; g.add(cover);
  rider.add(g);
  return g;
}
const wings = [
  { g: makeWing(), shoulder: V(0.05, 2.45, 0.4), grip: GRIP_L },
  { g: makeWing(), shoulder: V(0.05, 2.45, -0.4), grip: GRIP_R },
];

// legs (2-bone IK to pedals)
const THIGH = 0.78, SHIN = 0.78;
function makeLeg() {
  const thigh = makeStretch(0.075, white);
  const shin = makeStretch(0.045, legMat);
  const knee = shade(new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), legMat));
  const foot = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(0, -0.03); shape.lineTo(0.28, -0.13); shape.lineTo(0.24, -0.04); shape.lineTo(0.3, 0);
  shape.lineTo(0.24, 0.04); shape.lineTo(0.28, 0.13); shape.lineTo(0, 0.03);
  const footGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.025, bevelEnabled: false });
  footGeo.rotateX(Math.PI / 2);
  const fm = shade(new THREE.Mesh(footGeo, legMat));
  fm.position.set(-0.1, 0.045, 0);
  foot.add(fm);
  bike.add(thigh, shin, knee, foot);
  return { thigh, shin, knee, foot };
}
const legs = [makeLeg(), makeLeg()];
const hipBase = [V(-0.22, 1.85, 0.2), V(-0.22, 1.85, -0.2)];

function solveLeg(leg, hip, target) {
  const dx = target.x - hip.x, dy = target.y - hip.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, THIGH + SHIN - 0.001);
  const a = Math.atan2(dy, dx);
  const cosA = THREE.MathUtils.clamp((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d), -1, 1);
  const alpha = Math.acos(cosA);
  const kz = (hip.z + target.z) / 2;
  const knee = V(hip.x + THIGH * Math.cos(a + alpha), hip.y + THIGH * Math.sin(a + alpha), kz);
  placeBetween(leg.thigh, hip, knee);
  placeBetween(leg.shin, knee, target);
  leg.knee.position.copy(knee);
  leg.foot.position.copy(target);
}

// ---------- animation ----------
const clock = new THREE.Clock();
const SPEED = 3.2; // m/s along road
let dist = 0;
let lastHeading = 0;
const lastPos = new THREE.Vector3();
const tmpP = new THREE.Vector3();

function placeBike(phi) {
  bikeWorld.position.set(Math.cos(phi) * ROAD_R, 0, Math.sin(phi) * ROAD_R);
  bikeWorld.rotation.y = -phi - Math.PI / 2;
}

placeBike(0);
lastPos.copy(bikeWorld.position);
lastHeading = bikeWorld.rotation.y;
// initial camera: front-left three-quarter view
{
  const local = V(3.5, 2.6, -8.0);
  const world = local.applyMatrix4(bikeWorld.matrixWorld.identity().compose(bikeWorld.position, bikeWorld.quaternion, bikeWorld.scale));
  camera.position.copy(world);
  controls.target.copy(bikeWorld.position).add(V(0, 1.6, 0));
}

const pouch = head.getObjectByName('pouch');

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  dist += SPEED * dt;
  const phi = dist / ROAD_R;
  placeBike(phi);
  bike.rotation.x = 0.07; // lean into the turn

  // follow the bike with the camera
  tmpP.subVectors(bikeWorld.position, lastPos);
  camera.position.add(tmpP);
  controls.target.add(tmpP);
  lastPos.copy(bikeWorld.position);
  // keep the camera's angle relative to the bike's heading (user can still orbit)
  const dHeading = bikeWorld.rotation.y - lastHeading;
  lastHeading = bikeWorld.rotation.y;
  _v.subVectors(camera.position, controls.target).applyAxisAngle(UP, dHeading);
  camera.position.copy(controls.target).add(_v);

  // wheels and crank
  const wheelAngle = -dist / WHEEL_R;
  rearWheel.rotation.z = wheelAngle;
  frontWheel.rotation.z = wheelAngle;
  const crankAngle = wheelAngle / 2.2;
  crank.rotation.z = crankAngle;

  // body bob & sway synced with pedalling
  const bob = Math.sin(crankAngle * 2) * 0.025;
  rider.position.y = bob;
  rider.rotation.x = Math.sin(crankAngle) * 0.03;

  // head bob & pouch wobble
  head.rotation.z = -0.22 + Math.sin(t * 3.1) * 0.05;
  head.rotation.y = Math.sin(t * 0.9) * 0.15;
  pouch.scale.y = 0.6 + Math.sin(t * 6) * 0.04;

  // pedals & legs
  pedals.forEach((p, i) => {
    const ang = crankAngle + Math.PI / 2 + (p.side < 0 ? Math.PI : 0);
    const pos = V(BB.x + Math.cos(ang) * CRANK_L, BB.y + Math.sin(ang) * CRANK_L, p.side * 0.26);
    p.mesh.position.copy(pos);
    const hip = hipBase[i].clone(); hip.y += bob;
    solveLeg(legs[i], hip, V(pos.x, pos.y + 0.03, p.side * 0.24));
  });

  // wings: shoulder -> grip with a little flutter at the base
  wings.forEach((w, i) => {
    const s = w.shoulder.clone(); s.y += bob + Math.sin(t * 5 + i) * 0.02;
    const gripLocal = w.grip.clone(); gripLocal.y -= rider.position.y; // grip is in bike space
    const g = w.grip.clone().sub(rider.position);
    _v.subVectors(g, s);
    const len = _v.length();
    w.g.position.copy(s).addScaledVector(_v, 0.5);
    w.g.quaternion.setFromUnitVectors(UP, _v.clone().normalize());
    w.g.scale.set(1, len, 1);
  });

  // sun & shadow follow the bike
  sun.position.copy(bikeWorld.position).add(SUN_OFFSET);
  sun.target.position.copy(bikeWorld.position);

  clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > 100) c.position.x = -100; });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
